<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="netflixRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B20710" />
    </linearGradient>
    <linearGradient id="hnBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Fondo Dark Theme #141414 -->
  <rect width="128" height="128" rx="28" fill="#141414" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#262626" stroke-width="2"/>

  <!-- Letra F curvada estilo Netflix con acento rojo #E50914 -->
  <g filter="url(#shadow)">
    <!-- Barra vertical de la F -->
    <path d="M 28 24 L 46 24 L 46 104 L 28 104 Z" fill="url(#netflixRed)" />
    
    <!-- Barra superior curvada de la F -->
    <path d="M 46 24 L 92 24 C 95 24 96 27 94 30 L 86 42 C 85 43 83 44 81 44 L 46 44 Z" fill="url(#netflixRed)" />
    
    <!-- Barra media de la F con corte dinámico -->
    <path d="M 46 56 L 76 56 C 78 56 79 58 78 60 L 72 70 C 71 71 69 72 67 72 L 46 72 Z" fill="#E50914" />
    
    <!-- Cinta curvada diagonal característica de Netflix -->
    <path d="M 28 24 L 46 24 L 46 104 L 28 98 Z" fill="#99060D" opacity="0.6"/>
  </g>

  <!-- Badge 'HN' en la esquina inferior derecha -->
  <g transform="translate(68, 76)">
    <rect width="44" height="28" rx="6" fill="#1F1F1F" stroke="#E50914" stroke-width="1.5" />
    <text x="22" y="19" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="900" fill="url(#hnBadge)" text-anchor="middle" letter-spacing="1">HN</text>
  </g>
</svg>
