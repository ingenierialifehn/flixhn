services:
  # Database Service (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: flixhn_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-flixhn}
      MYSQL_USER: ${DB_USERNAME:-flixhn_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-flixhn_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - flixhn_net
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      timeout: 5s
      retries: 5
      start_period: 15s

  # Backend Service (PHP 8.3 FPM + Laravel 11)
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: flixhn_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage_media:/var/www/html/storage/media
      - backend_storage_app:/var/www/html/storage/app
      - backend_storage_framework:/var/www/html/storage/framework
      - backend_storage_logs:/var/www/html/storage/logs
      - backend_storage_media:/var/media:ro
      - /mnt/media_library:/mnt/media_library:ro
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-flixhn}
      DB_USERNAME: ${DB_USERNAME:-flixhn_user}
      DB_PASSWORD: ${DB_PASSWORD:-flixhn_secret}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-base64:ekQ3f/Sody1ONo82Wl+CfomzAOeaj45HYYRurVD8cnw=}
      SANCTUM_STATEFUL_DOMAINS: "localhost,127.0.0.1"
      SESSION_DRIVER: cookie
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      APP_CONFIG_CACHE: /tmp/config.php
      APP_PACKAGES_CACHE: /tmp/packages.php
      APP_SERVICES_CACHE: /tmp/services.php
    depends_on:
      db:
        condition: service_healthy
    networks:
      - flixhn_net

  # Frontend Service (Node / Vite Dev Server o Static Serve)
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: flixhn_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api
      - VITE_STREAM_URL=http://localhost:7000/media
      - NODE_PATH=/app/node_modules
      - NODE_OPTIONS=--import /tmp/fs-shim.js
    command: >
      sh -c "cp /app/vite.config.js /tmp/vite.config.js 2>/dev/null;
             cp /app/fs-shim.js /tmp/fs-shim.js 2>/dev/null;
             /app/node_modules/.bin/vite --config /tmp/vite.config.js --host 0.0.0.0"
    networks:
      - flixhn_net

  # Nginx Gateway & Video Streaming Server
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: flixhn_nginx
    restart: unless-stopped
    ports:
      - "80:80"       # Web Portal & API
      - "7000:7000"   # High-Performance HLS / Media Streaming
    volumes:
      - ./backend:/var/www/html
      - backend_storage_media:/var/media:ro
      - /mnt/media_library:/mnt/media_library:ro
      - backend_storage_app:/var/www/html/storage/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - flixhn_net

volumes:
  db_data:
    driver: local
  backend_vendor:
    driver: local
  backend_storage_media:
    external: true
  backend_storage_app:
    external: true
  backend_storage_framework:
    external: true
  backend_storage_logs:
    external: true

networks:
  flixhn_net:
    driver: bridge
