# ==============================================================================
# FlixHN - Gateway Principal Nginx (Frontend & Laravel API)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 2048M;

    # Optimización de Rendimiento y Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        image/svg+xml
        image/x-icon
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Encabezados de seguridad
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Proxy a Laravel API
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Proxy a Laravel Sanctum CSRF Cookie si aplica
    location /sanctum {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Archivos estáticos de Laravel Storage (Portadas, Backdrops subidos)
    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Caché agresivo y compresión para assets estáticos (JS, CSS, fuentes, imágenes, favicons)
    location ~* \.(?:ico|gif|jpe?g|png|svg|woff|woff2|ttf|eot|webp|css|js|map)$ {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Servir directamente archivos y segmentos de video evitando workers PHP-FPM
    location /media/ {
        alias /var/media/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        
        # CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Origin, Accept, X-Requested-With, Content-Type' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;

        location ~* \.m3u8$ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }

        location ~* \.ts$ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 365d;
        }

        location ~* \.mp4$ {
            mp4;
            mp4_buffer_size 1m;
            mp4_max_buffer_size 10m;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }
    }

    # Procesador PHP-FPM para Laravel
    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 600;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Proxy al Servidor de Frontend (React / Vite) con soporte para WebSocket (HMR)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==============================================================================
# FlixHN - Servidor de Streaming de Alto Rendimiento HLS & MP4 (On-Net ISP)
# ==============================================================================
server {
    listen 7000;
    listen [::]:7000;
    server_name localhost;
    root /var/media;

    # Optimización de I/O de red para Streaming
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Compresión gzip para playlists de streaming y subtítulos
    gzip on;
    gzip_types application/vnd.apple.mpegurl text/vtt;

    # Habilitar CORS amplio para que cualquier reproductor cliente en la LAN pueda consumir el stream
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Range, Origin, Accept, X-Requested-With, Content-Type' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;

    # Tipos MIME para HLS y Video
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        video/mp4 mp4;
        text/vtt vtt;
    }

    location /media/ {
        alias /var/media/;
        autoindex off;

        # Manejo de pre-flight OPTIONS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Range, Origin, Accept, X-Requested-With, Content-Type';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Caché de listas de reproducción .m3u8 (no cachear o muy bajo tiempo para streaming dinámico)
        location ~* \.m3u8$ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }

        # Caché agresivo para segmentos de video .ts (inmutables)
        location ~* \.ts$ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 365d;
        }

        # Soporte para MP4 Directo con Byte-Ranges (Seek)
        location ~* \.mp4$ {
            mp4;
            mp4_buffer_size 1m;
            mp4_max_buffer_size 10m;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }
    }
}
